name: Held iOS build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      signed_device_ipa:
        description: "Build a signed development IPA (requires signing secrets)"
        required: true
        type: boolean
        default: false
      team_id:
        description: "Apple Developer Team ID (signed IPA only)"
        required: false
        type: string
        default: FLVKJ8ZLZV
      provisioning_profile_name:
        description: "Development provisioning profile name (signed IPA only)"
        required: false
        type: string
      capture_native_screenshots:
        description: "Also run native iPhone/iPad UI tests and export screenshots"
        required: true
        type: boolean
        default: false
      app_store_release:
        description: "Run Apple Distribution archive/export (requires release secrets)"
        required: true
        type: boolean
        default: false
      upload_testflight:
        description: "Upload the App Store IPA to TestFlight (release API secrets required)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: Held
      PROJECT: Held.xcodeproj
      BUNDLE_ID: com.held.groupbuy
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select latest stable Xcode 26
        run: |
          : > build.log
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -Ev 'beta|RC' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then echo "No stable Xcode 26 found on runner" >&2; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Restore and verify application icon
        run: |
          ICON_BASE="Held/Assets.xcassets/AppIcon.appiconset/Held-1024"
          PART_DIR="${ICON_BASE}.base64.parts"
          cat "$PART_DIR"/part-* > "${ICON_BASE}.base64"
          base64 --decode < "${ICON_BASE}.base64" > "${ICON_BASE}.png"
          test -s "${ICON_BASE}.png"
          echo "225f4f83470d92bb64de57fe6e8411794a9d0674524407cbb1ce67b3e1f66d56  ${ICON_BASE}.png" | shasum -a 256 -c -

      - name: Verify project and sources
        run: |
          test -f "$PROJECT/project.pbxproj"
          test -f Held/PrivacyInfo.xcprivacy
          test -f Held/Assets.xcassets/AppIcon.appiconset/Held-1024.png
          test -f KeyvowShareExtension/Info.plist
          test -f KeyvowShareExtension/PrivacyInfo.xcprivacy
          test -f KeyvowShareExtension/KeyvowShareExtension.entitlements
          plutil -lint Held/PrivacyInfo.xcprivacy
          plutil -lint Held/Held.entitlements
          plutil -lint KeyvowShareExtension/Info.plist
          plutil -lint KeyvowShareExtension/PrivacyInfo.xcprivacy
          plutil -lint KeyvowShareExtension/KeyvowShareExtension.entitlements

      - name: Compile without signing
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.signed_device_ipa) }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log

      - name: Run unit tests on iOS Simulator
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.signed_device_ipa) }}
        run: |
          set -o pipefail
          : > test.log
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Archive Release without signing
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.signed_device_ipa && !inputs.app_store_release) }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Keyvow-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            clean archive 2>&1 | tee release-archive.log
          APP_PATH="$RUNNER_TEMP/Keyvow-unsigned.xcarchive/Products/Applications/Held.app"
          SHARE_PATH="$APP_PATH/PlugIns/KeyvowShareExtension.appex"
          test -d "$APP_PATH"
          test -d "$SHARE_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "Keyvow"
          echo "Unsigned Release archive structure and Share Extension verified"

      - name: Validate signing inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_device_ipa }}
        env:
          TEAM_ID: ${{ inputs.team_id }}
          PROFILE_NAME: ${{ inputs.provisioning_profile_name }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for value in TEAM_ID PROFILE_NAME CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [ -z "${!value}" ]; then
              echo "Missing required signing input or secret: $value" >&2
              exit 1
            fi
          done

      - name: Install development signing identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_device_ipa }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-held-keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" held-build.keychain-db
          security set-keychain-settings -lut 3600 held-build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" held-build.keychain-db
          security list-keychains -d user -s held-build.keychain-db login.keychain-db
          security default-keychain -d user -s held-build.keychain-db
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/Held-Certificate.p12"
          security import "$RUNNER_TEMP/Held-Certificate.p12" \
            -k held-build.keychain-db \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/security \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" held-build.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/Held-Development.mobileprovision"
          rm -f "$RUNNER_TEMP/Held-Certificate.p12"

      - name: Archive signed iOS device app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_device_ipa }}
        env:
          TEAM_ID: ${{ inputs.team_id }}
          PROFILE_NAME: ${{ inputs.provisioning_profile_name }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Held.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Development' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive | tee archive.log

      - name: Export development IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_device_ipa }}
        env:
          TEAM_ID: ${{ inputs.team_id }}
          PROFILE_NAME: ${{ inputs.provisioning_profile_name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$RUNNER_TEMP/Held-IPA"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Held.xcarchive" \
            -exportPath "$RUNNER_TEMP/Held-IPA" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Inspect IPA and embedded signature
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_device_ipa }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/Held-IPA" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          unzip -l "$IPA_PATH"
          ditto -x -k "$IPA_PATH" "$RUNNER_TEMP/Held-IPA-Inspect"
          codesign -dv --verbose=4 "$RUNNER_TEMP/Held-IPA-Inspect/Payload/Held.app"
          security cms -D -i "$RUNNER_TEMP/Held-IPA-Inspect/Payload/Held.app/embedded.mobileprovision" | plutil -p -
          cp "$IPA_PATH" Held.ipa

      - name: Upload simulator build log
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.signed_device_ipa)) }}
        uses: actions/upload-artifact@v4
        with:
          name: held-simulator-build-log
          path: |
            build.log
            test.log
            release-archive.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed development IPA
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.signed_device_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: held-signed-development-ipa
          path: Held.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean temporary keychain
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.signed_device_ipa }}
        run: |
          security delete-keychain held-build.keychain-db || true
          rm -f "$RUNNER_TEMP/Held-Certificate.p12"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/Held-Development.mobileprovision"

      - name: Report unsigned build result
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.signed_device_ipa)) }}
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const status = process.env.JOB_STATUS;
            const log = fs.existsSync('build.log')
              ? fs.readFileSync('build.log', 'utf8')
              : '(build.log was not created)';
            const tail = log.slice(-12000);

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Held iOS build #${process.env.RUN_NUMBER}: ${status}`,
              body: [
                `Status: ${status}`,
                `Run: ${process.env.RUN_URL}`,
                '',
                'build.log tail:',
                '```text',
                tail,
                '```'
              ].join('\n')
            });

  screenshots:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_native_screenshots }}
    uses: ./.github/workflows/ios-screenshots.yml

  app_store_release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.app_store_release }}
    uses: ./.github/workflows/ios-release.yml
    secrets: inherit
    with:
      team_id: ${{ inputs.team_id }}
      upload_testflight: ${{ inputs.upload_testflight }}
