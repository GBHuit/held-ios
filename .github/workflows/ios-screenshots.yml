name: Keyvow native UI screenshots

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: iPhone
            device: iPhone 17
            artifact: iphone
          - kind: iPad
            device: ""
            artifact: ipad-13-inch
    env:
      DEVICE_KIND: ${{ matrix.kind }}
      REQUESTED_DEVICE: ${{ matrix.device }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select latest stable Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -Ev 'beta|RC' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then echo "No stable Xcode 26 found on runner" >&2; exit 1; fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Restore and verify application icon
        run: |
          ICON_BASE="Held/Assets.xcassets/AppIcon.appiconset/Held-1024"
          cat "${ICON_BASE}.base64.parts"/part-* > "${ICON_BASE}.base64"
          base64 --decode < "${ICON_BASE}.base64" > "${ICON_BASE}.png"
          test -s "${ICON_BASE}.png"
          echo "225f4f83470d92bb64de57fe6e8411794a9d0674524407cbb1ce67b3e1f66d56  ${ICON_BASE}.png" | shasum -a 256 -c -

      - name: Select an available simulator
        run: |
          if [ "$DEVICE_KIND" = "iPad" ]; then
            DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; names=[d["name"] for runtime in sorted(devices, reverse=True) for d in devices[runtime] if d.get("isAvailable") and "iPad" in d["name"] and "13-inch" in d["name"]]; print(names[0] if names else "")')
          else
            DEVICE_NAME="$REQUESTED_DEVICE"
          fi
          if [ -z "$DEVICE_NAME" ]; then
            echo "No available 13-inch iPad simulator was found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "Using $DEVICE_NAME"

      - name: Run native UI tests and capture screenshots
        run: |
          set -o pipefail
          xcodebuild \
            -project Held.xcodeproj \
            -scheme KeyvowScreenshots \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME,OS=latest" \
            -resultBundlePath "$RUNNER_TEMP/Keyvow-$ARTIFACT_NAME.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "Keyvow-$ARTIFACT_NAME-UI.log"

      - name: Export real simulator screenshot attachments
        run: |
          mkdir -p "Artifacts/$ARTIFACT_NAME"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/Keyvow-$ARTIFACT_NAME.xcresult" \
            --output-path "Artifacts/$ARTIFACT_NAME"
          python3 - "Artifacts/$ARTIFACT_NAME" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          images = sorted(root.rglob("*.png"))
          if len(images) < 6:
              raise SystemExit(f"Expected at least six native screenshots, found {len(images)}")
          for image in images:
              data = image.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n" or len(data) < 30:
                  raise SystemExit(f"Invalid PNG attachment: {image}")
              color_type = data[25]
              if color_type in (4, 6):
                  raise SystemExit(f"App Store screenshots must not contain alpha: {image}")
              width = int.from_bytes(data[16:20], "big")
              height = int.from_bytes(data[20:24], "big")
              print(f"{image.name}: {width}x{height}, PNG color type {color_type}, {len(data)} bytes")
          PY

      - name: Upload native screenshots and test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: keyvow-native-${{ matrix.artifact }}
          path: |
            Artifacts/${{ matrix.artifact }}/
            Keyvow-${{ matrix.artifact }}-UI.log
          if-no-files-found: warn
          retention-days: 30
